<!DOCTYPE html>
<html>
<head>
  <title>Register OAuth Client</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      background: #101114;
      color: #d7dce2;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .container {
      width: min(100%, 420px);
      margin-top: 24px;
      background-color: #1b1d21;
      padding: 34px 28px 28px;
      border: 1px solid #292c33;
      border-radius: 8px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.42);
    }

    h1 {
      color: #e5e9ef;
      text-align: center;
      font-size: 24px;
      margin: 0 0 28px;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    input {
      padding: 13px 14px;
      margin-bottom: 15px;
      border: 1px solid #2b2f37;
      border-radius: 5px;
      background-color: #111216;
      color: #e5e9ef;
      font-size: 14px;
    }

    input::placeholder {
      color: #8c939e;
    }

    input:focus {
      border-color: #85b8ff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(133, 184, 255, 0.16);
    }

    button {
      padding: 12px;
      background-color: #88b9ff;
      color: #182235;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
    }

    button:hover {
      background-color: #9cc6ff;
    }

    .success {
      color: #dce4ee;
      padding: 15px;
      background-color: #1d1a12;
      border-left: 4px solid #f5a915;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .success strong {
      color: #f1f4f8;
    }

    .error {
      color: #ffd6d6;
      padding: 15px;
      background-color: #241417;
      border: 1px solid #5b252d;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .client-info {
      background-color: #111216;
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 15px;
      border: 1px solid #2b2f37;
    }

    .client-info p {
      margin: 5px 0;
      word-break: break-all;
    }

    .link {
      text-align: center;
      margin-top: 15px;
    }

    .link a {
      color: #88b9ff;
      text-decoration: none;
      display: block;
      margin-top: 10px;
    }

    .link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Register OAuth Client</h1>
    <div class="success" {{if not .Success}}hidden{{end}}>
      <strong>Success!</strong> OAuth Client registered successfully.
      <div class="client-info">
        <p><strong>Client ID:</strong> {{.ClientID}}</p>
        <p><strong>Redirect URI:</strong> {{.RedirectURI}}</p>
      </div>
    </div>
    <div class="error" {{if not .Error}}hidden{{end}}>
      <strong>Error:</strong> {{.Error}}
    </div>
    <form method="POST">
      <input name="redirect_uri" placeholder="Redirect URI (e.g., http://localhost:3000/callback)" required />
      <button type="submit">Register Client</button>
    </form>
    <div class="link">
      <p><a href="/register">Register User</a></p>
      <p><a href="/login">Back to Login</a></p>
    </div>
  </div>
</body>
</html>
